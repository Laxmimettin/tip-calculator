<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="calculator">
        <header class="header">
            <div class="icon">₹</div>
            <h1>Tip Calculator</h1>
            <p>Split the bill, share the happiness.</p>
        </header>

        <section class="form-group">
            <label for="bill">Bill Amount (₹)</label>
            <input type="number" id="bill" min="0" step="0.01" placeholder="Enter bill amount">
        </section>

        <section class="form-group">
            <label>Select Tip Percentage</label>
            <div class="tip-buttons">
                <button type="button" data-tip="5">5%</button>
                <button type="button" data-tip="10" class="active">10%</button>
                <button type="button" data-tip="15">15%</button>
                <button type="button" data-tip="20">20%</button>
            </div>

            <label for="customTip" class="custom-label">
                Custom tip (%)
            </label>
            <input type="number" id="customTip" min="0" max="100" step="1" placeholder="Enter custom percentage">
        </section>

        <section class="form-group">
            <label for="people">Number of People</label>
            <div class="people-control">
                <button type="button" id="minus" aria-label="Decrease people">−</button>
                <input type="number" id="people" min="1" step="1" value="2">
                <button type="button" id="plus" aria-label="Increase people">+</button>
            </div>
        </section>

        <p id="error" class="error" role="alert"></p>

        <section class="results">
            <div class="result-row">
                <div>
                    <h3>Tip Amount</h3>
                    <p>Your total tip</p>
                </div>
                <strong id="tipAmount">₹0.00</strong>
            </div>

            <div class="result-row">
                <div>
                    <h3>Total Bill</h3>
                    <p>Bill + tip</p>
                </div>
                <strong id="totalBill">₹0.00</strong>
            </div>

            <div class="result-row">
                <div>
                    <h3>Tip Per Person</h3>
                    <p>Each person's share</p>
                </div>
                <strong id="tipPerPerson">₹0.00</strong>
            </div>

            <div class="per-person">
                <p>Total Per Person</p>
                <h2 id="totalPerPerson">₹0.00</h2>
            </div>
        </section>

        <button type="button" id="reset" class="reset-btn">
            ↻ Reset Calculator
        </button>

        <footer>Made with ♥ for smarter splitting</footer>
    </main>

    <script src="script.js"></script>
</body>

</html>
